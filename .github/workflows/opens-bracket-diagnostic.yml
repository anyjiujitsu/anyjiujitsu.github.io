name: OPENS bracket diagnostic (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opens-bracket-diagnostic
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Inspect current published brackets without publishing any changes
        env:
          OPENS_EDGE_CAPTURE: 'true'
        run: python opens/refresh_ibjjf.py
      - name: Upload actual unresolved-bracket HTML for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unresolved-bracket-html
          path: opens/.edge-evidence/*.html
          if-no-files-found: warn
          retention-days: 2
